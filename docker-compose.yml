services:
  lms:
    container_name: lms
    image: ${IMAGE_NAME:-tsshadow/lms}:${LMS_TAG:-stable}
    expose:
      - "5082"
    ports:
      - "${LMS_PORT:-80}:5082"
    volumes:
      - ${MUSIC_PATH:-/music}:/music
      - ${DOCKER_DATA_PATH:-/docker}/lms/usr/local/etc:/usr/local/etc
      - ${DOCKER_DATA_PATH:-/docker}/lms/var/lms:/var/lms
    environment:
      - LMS_MUSIC_MANAGEMENT_RATING_API_URL=${LMS_MUSIC_MANAGEMENT_RATING_API_URL:-http://muma-rating-system:8000/api/lms-event}
      - LMS_MUSIC_MANAGEMENT_RATING_API_KEY=${LMS_MUSIC_MANAGEMENT_RATING_API_KEY}
      - LMS_MUSIC_MANAGEMENT_SCROBBLING_API_URL=${LMS_MUSIC_MANAGEMENT_SCROBBLING_API_URL:-http://muma-scrobble-service:8000/scrobble}
      - LMS_MUSIC_MANAGEMENT_SCROBBLING_API_KEY=${LMS_MUSIC_MANAGEMENT_SCROBBLING_API_KEY}
      - LMS_MUSIC_MANAGEMENT_USER_API_URL=${LMS_MUSIC_MANAGEMENT_USER_API_URL}
      - LMS_MUSIC_MANAGEMENT_USER_API_KEY=${LMS_MUSIC_MANAGEMENT_USER_API_KEY}
    networks:
      - default
      - music-management_db
    user: "0:0"
    restart: unless-stopped
  lms_alpha:
    container_name: lms_alpha
    image: ${IMAGE_NAME:-tsshadow/lms}:${LMS_ALPHA_TAG:-latest}
    expose:
      - "5082"
    ports:
      - "${LMS_ALPHA_PORT:-8080}:5082"
    volumes:
      - ${MUSIC_PATH:-/music}:/music
      - ${DOCKER_DATA_PATH:-/docker}/alpha-lms/usr/local/etc:/usr/local/etc
      - ${DOCKER_DATA_PATH:-/docker}/alpha-lms/var/lms:/var/lms
    environment:
      - LMS_MUSIC_MANAGEMENT_RATING_API_URL=${LMS_MUSIC_MANAGEMENT_RATING_API_URL:-http://muma-rating-system:8000/api/lms-event}
      - LMS_MUSIC_MANAGEMENT_RATING_API_KEY=${LMS_MUSIC_MANAGEMENT_RATING_API_KEY}
      - LMS_MUSIC_MANAGEMENT_SCROBBLING_API_URL=${LMS_MUSIC_MANAGEMENT_SCROBBLING_API_URL:-http://muma-scrobble-service:8000/scrobble}
      - LMS_MUSIC_MANAGEMENT_SCROBBLING_API_KEY=${LMS_MUSIC_MANAGEMENT_SCROBBLING_API_KEY}
      - LMS_MUSIC_MANAGEMENT_USER_API_URL=${LMS_MUSIC_MANAGEMENT_USER_API_URL}
      - LMS_MUSIC_MANAGEMENT_USER_API_KEY=${LMS_MUSIC_MANAGEMENT_USER_API_KEY}
    networks:
      - default
      - music-management_db
    user: "0:0"
    restart: unless-stopped

networks:
  music-management_db:
    external: true
    name: music-management_db
